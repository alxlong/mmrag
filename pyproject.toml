[project]
name = "mmrag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "alxlong", email = "alexlong667@berkeley.edu" }
]
requires-python = ">=3.9"
dependencies = [
    "anthropic>=0.125.0",
    "clip-score>=0.2.1",
    "datasets>=4.5.0",
    "duckdb>=1.4.5",
    "hfdownloader>=1.0.2",
    "httpx>=0.28.1",
    "huggingface-hub[cli,hf-xet]>=1.8.0",
    "img2dataset>=1.47.0",
    "lancedb>=0.27.1",
    "numpy>=2.0.2",
    "open-clip-torch>=3.3.0",
    "pandas>=2.3.3",
    "pillow>=11.3.0",
    "pyarrow>=21.0.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.6.1",
    "scipy>=1.13.1",
    "torch>=2.8.0",
    "tqdm>=4.70.0",
    "transformers>=4.12.2",
    "webdataset>=0.2.100",
]

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=8.4.2",
    "ruff>=0.16.5",
]
